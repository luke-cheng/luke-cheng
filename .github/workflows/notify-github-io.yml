name: Notify luke-cheng.github.io

on:
  push:
    branches: [main]
    paths:
      - LukeCheng.md
      - blogs/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger GitHub Pages build
        env:
          GH_TOKEN: ${{ secrets.PAGES_REPOSITORY_DISPATCH_TOKEN }}
        run:
          | # https://docs.github.com/en/rest/actions/workflows?apiVersion=2026-03-10#create-a-workflow-dispatch-event
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            /repos/luke-cheng/luke-cheng.github.io/actions/workflows/deploy.yml/dispatches \
            -f ref=main \
            -f inputs[content_sha]="$GITHUB_SHA"
